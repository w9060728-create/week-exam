<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技術評核系統 - 專業能力測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e2e8f0;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
        /* 盲測模式專用：選中後統一顯示為藍色，絕對不提示對錯 */
        .selected-ans { 
            background-color: #eff6ff !important; 
            border-color: #3b82f6 !important; 
            color: #1e3a8a !important; 
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1) !important;
            transform: scale(1.01);
        }
        .disabled-btn { pointer-events: none; opacity: 0.6; }
        .blink-red { animation: blinker 1s linear infinite; color: #ef4444; font-weight: bold; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 text-slate-800 flex items-center justify-center min-h-screen p-4 selection:bg-blue-200">

    <!-- 測試模式提示條 -->
    <div id="test-banner" class="fixed top-0 left-0 w-full bg-amber-400 text-amber-900 text-center text-sm font-bold py-1.5 z-50 shadow hidden">
        ⚠️ 目前為【測試模式】：日期限制與計時器皆已關閉，正式考試前請記得改回來
    </div>

    <div id="login-screen" class="glass-card p-10 rounded-3xl w-full max-w-md transition-all duration-500 mt-8">
        <div class="text-center mb-8">
            <span class="inline-block p-3 rounded-2xl bg-blue-50 mb-3 shadow-inner">
                <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </span>
            <h1 class="text-3xl font-extrabold text-gradient bg-gradient-to-r from-blue-700 to-cyan-600 tracking-tight">技術評核系統</h1>
            <p class="text-sm text-slate-500 mt-2 font-medium">Stellantis 專業能力測驗 (共35題)</p>
        </div>
        
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">經銷商名稱</label>
                <input type="text" id="dealer-input" class="w-full px-5 py-3.5 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-white/50 shadow-sm transition-all text-slate-700 outline-none font-medium" placeholder="例如：星聯板橋">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">技師姓名</label>
                <input type="text" id="name-input" class="w-full px-5 py-3.5 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-white/50 shadow-sm transition-all text-slate-700 outline-none font-medium" placeholder="請輸入本名">
            </div>

            <button onclick="startExam()" class="w-full bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-700 hover:to-blue-900 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-200 text-lg tracking-wide mt-4">
                進入評核測驗
            </button>
        </div>
    </div>

    <div id="quiz-screen" class="hidden glass-card p-8 md:p-10 rounded-3xl w-full max-w-3xl relative transition-all duration-500 mt-8">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div class="bg-blue-50 px-4 py-2 rounded-lg border border-blue-100 shadow-sm">
                <span class="text-sm font-extrabold text-blue-700" id="progress-text">第 1 / 35 題</span>
            </div>
            
            <div id="timers-wrapper" class="flex gap-3">
                <div class="flex items-center gap-2 bg-red-50 px-4 py-2 rounded-lg border border-red-100 shadow-sm">
                    <span class="text-sm font-bold text-red-600" id="q-timer-display">⏳ 本題: 02:00</span>
                </div>
            </div>
        </div>
        
        <div class="w-full bg-slate-100 rounded-full h-2.5 mb-8 shadow-inner overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-cyan-400 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 2%"></div>
        </div>

        <h2 id="question-text" class="text-xl md:text-2xl font-bold mb-4 leading-relaxed text-slate-800">題目載入中...</h2>
        
        <div id="question-image-container" class="hidden w-full mb-8 text-center rounded-xl overflow-hidden shadow-sm border border-slate-200 bg-white p-2">
            <img id="question-image" src="" alt="題目圖片" class="max-w-full h-auto mx-auto max-h-64 object-contain">
        </div>
        
        <div id="options-container" class="space-y-4 mb-8"></div>

        <div id="feedback-box" class="hidden p-5 rounded-xl mb-6 font-bold text-center text-lg shadow-sm border"></div>

        <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-gradient-to-r from-slate-700 to-slate-900 hover:from-slate-800 hover:to-black text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-200 text-lg tracking-wide">
            前往下一題 ➔
        </button>
    </div>

    <!-- 盲測專用：絕對不顯示分數與等級的結果畫面 -->
    <div id="result-screen" class="hidden glass-card p-10 rounded-3xl w-full max-w-md text-center transition-all duration-500 mt-8">
        <div class="inline-block p-4 rounded-full bg-green-50 mb-6 shadow-inner">
            <span class="text-5xl">✅</span>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-800 mb-4">測驗已結束</h2>
        <p class="text-slate-500 font-medium mb-8 leading-relaxed">
            感謝您的參與！<br>您的作答紀錄已安全傳送至總部後台進行評核。
        </p>

        <div class="bg-white p-5 rounded-xl border border-slate-100 text-left text-sm text-slate-600 font-medium leading-relaxed shadow-sm space-y-3">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                <span>經銷商：<span id="res-dealer" class="font-bold text-slate-800"></span></span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                <span>姓名：<span id="res-name" class="font-bold text-slate-800"></span></span>
            </div>
            <div class="flex items-center gap-2 mt-4 pt-3 border-t border-slate-100">
                <svg class="w-4 h-4 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                <span class="text-green-600">系統資料同步完成，您可以關閉此網頁。</span>
            </div>
        </div>
    </div>

<script>

    // ============================================================
    const ENABLE_EXAM_WINDOW = false;   
    const ENABLE_TIMERS = false;        
    const EXAM_START = new Date('2026-07-22T12:30:00+08:00');
    const EXAM_END   = new Date('2026-07-22T13:30:00+08:00');
    
    if(!ENABLE_EXAM_WINDOW || !ENABLE_TIMERS) {
        document.getElementById('test-banner').classList.remove('hidden');
    }
    // ============================================================

    // ★ 150 題 綜合技術題庫 (Level 1 ~ 5) ★

        // ====== Level 1: 新手學徒 (基礎與常識) ======
        { level: 1, q: "車輛進廠保養時，測量輪胎胎紋深度的法定最低安全標準為何？", a: ["0.8 mm", "1.6 mm", "2.0 mm", "3.0 mm"], c: 1 },

        { level: 1, q: "更換機油濾清器時，為避免漏油或拆卸困難，正確的安裝方式為何？", a: ["直接用氣動工具打緊", "在O型環上塗抹少許新機油後，依規定扭力或手轉逼緊", "不需要安裝O型環", "在螺牙上塗抹螺絲膠"], c: 1 },
        { level: 1, q: "儀表板上亮起「紅色」的警告燈號，通常代表什麼意義？", a: ["輔助系統啟動", "系統警戒，建議盡快預約進廠", "危險或嚴重故障，應立即安全停駛並熄火", "保養時間已到"], c: 2 },

        { level: 1, q: "雨刷水噴不出水，且聽不到噴水馬達運轉聲，最基礎的第一步檢查是什麼？", a: ["更換噴水馬達", "拆下前保險桿", "檢查雨刷水箱保險絲是否燒毀", "更換雨刷撥桿"], c: 2 },

        { level: 1, q: "Peugeot 3008/5008 的標準 OBD2 診斷接頭通常位於何處？", a: ["引擎室保險絲盒內", "副駕駛座手套箱下方", "駕駛座儀表台左下方或中控台下方飾蓋內", "後車廂備胎旁"], c: 2 },

        { level: 1, q: "在 Alfa 儀表邏輯中，「黃色」燈號代表什麼含意？", a: ["作動", "警戒", "停駛", "輔助"], c: 1 },
        { level: 1, q: "在 Alfa 儀表邏輯中，「藍色」燈號代表什麼含意？", a: ["作動", "警戒", "停駛", "輔助"], c: 3 },
        { level: 1, q: "在 Alfa 儀表邏輯中，「紅色」燈號代表什麼含意？", a: ["作動", "警戒", "停駛/危險", "輔助"], c: 2 },
        { level: 1, q: "使用活動扳手時,應以下列何者受力？", a: ["轉動邊", "固定邊", "螺紋", "活動邊"], c: 1 },
        { level: 1, q: "拆裝螺絲時,應以下列何者列為最優先選擇使用？", a: ["開口扳手", "梅花扳手", "棘輪扳手", "活動扳手"], c: 1 },
        { level: 1, q: "測量軸端間隙和齒隙的最好工具是？", a: ["游標卡尺", "間隙規", "內徑測微器", "測微指示錶(千分錶)"], c: 3 },

        // ====== Level 2: 初級技師 (基礎診斷與原理) ======
        { level: 2, q: "將 VCI 連接至車輛後，啟動 DiagBox 時，系統通常會自動讀取哪項資訊來辨識車型？", a: ["引擎號碼", "車主姓名", "VIN 碼 (車身號碼)", "底盤型號"], c: 2 },

    // ============================================================
    // ★ 全盲測 - 自適應引擎狀態 (Blind Adaptive Logic) ★
    // ============================================================
    let state = {
        dealer: "", name: "", 
        currentQ: 0, 
        rawScore: 0, // 實際獲得的權重分數
        logs: [], 
        qTimer: 120, qInterval: null,
        isAnswered: false, inProgress: false,
        
        currentDifficultyLevel: 1, // 所有人第一題必定從 Level 1 開始
        maxQuestions: 35,          // 總共考 35 題
        usedQuestions: new Set(),  // 防止重複
        currentQuestionData: null
    };

    let isFormSubmitted = false;

    // 定義階級名稱
    const rankTitles = {
        1: "新手學徒",
        2: "初級技師",
        3: "中級技師",
        4: "高級技師",
        5: "大師級專家"
    };

    document.getElementById('hidden_iframe').onload = function() {
        if(isFormSubmitted) {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("res-dealer").innerText = state.dealer;
            document.getElementById("res-name").innerText = state.name;
            // 盲測模式：隱藏所有成績與等級，只顯示完成訊息。
        }
    };

    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    window.addEventListener("beforeunload", function (e) {
        if (state.inProgress) {
            e.preventDefault();
            e.returnValue = "測驗尚未完成，確定要離開嗎？進度將遺失。";
        }
    });

    window.addEventListener("visibilitychange", function() {
        if (document.visibilityState === 'hidden' && state.inProgress) {
            forceSubmit(true); 
        }
    });

    function startExam() {
        const d = document.getElementById("dealer-input").value.trim();
        const n = document.getElementById("name-input").value.trim();
        if (!d || !n) return alert("請完整填寫經銷商與姓名！");

        state.dealer = d; 
        state.name = n;
        state.inProgress = true; 
        
        document.getElementById("login-screen").classList.add("opacity-0", "scale-95");
        setTimeout(() => {
            document.getElementById("login-screen").classList.add("hidden");
            const quiz = document.getElementById("quiz-screen");
            quiz.classList.remove("hidden");
            void quiz.offsetWidth;
            quiz.classList.remove("opacity-0", "scale-95");

            loadNextAdaptiveQuestion();
        }, 300);
    }

    // 抽取動態難度考題
    function getNextQuestion() {
        let availableQs = allQuizData.map((q, index) => ({...q, globalIndex: index}))
                                     .filter(q => q.level === state.currentDifficultyLevel && !state.usedQuestions.has(q.globalIndex));
        
        if (availableQs.length === 0) {
            availableQs = allQuizData.map((q, index) => ({...q, globalIndex: index}))
                                     .filter(q => !state.usedQuestions.has(q.globalIndex));
        }

        let q = availableQs[Math.floor(Math.random() * availableQs.length)];
        state.usedQuestions.add(q.globalIndex);

        let originalCorrectText = q.a[q.c]; 
        let shuffledOptions = shuffleArray(q.a); 
        let newCorrectIndex = shuffledOptions.indexOf(originalCorrectText); 

        return {
            q: q.q,
            a: shuffledOptions,
            c: newCorrectIndex,
            level: q.level
        };
    }

    function startQuestionTimer() {
        clearInterval(state.qInterval);
        state.qTimer = 120; 
        updateQTimerDisplay();

        state.qInterval = setInterval(() => {
            state.qTimer--;
            updateQTimerDisplay();

            if (state.qTimer <= 0) {
                clearInterval(state.qInterval);
                handleQuestionTimeUp();
            }
        }, 1000);
    }

    function updateQTimerDisplay() {
        let m = Math.floor(state.qTimer / 60).toString().padStart(2, '0');
        let s = (state.qTimer % 60).toString().padStart(2, '0');
        const qDisplay = document.getElementById("q-timer-display");
        qDisplay.innerText = `⏳ 本題: ${m}:${s}`;
        
        if(state.qTimer <= 10 && state.qTimer > 0) {
            qDisplay.parentElement.classList.add("animate-pulse", "bg-red-100", "border-red-300");
        } else {
            qDisplay.parentElement.classList.remove("animate-pulse", "bg-red-100", "border-red-300");
        }
    }

    function handleQuestionTimeUp() {
        if (state.isAnswered) return;
        state.isAnswered = true;

        const qData = state.currentQuestionData;
        const correctIndex = qData.c;
        const allBtns = document.querySelectorAll(".option-btn");
        const fbBox = document.getElementById("feedback-box");

        allBtns.forEach(b => b.classList.add("disabled-btn"));

        let logText = `Q${state.currentQ + 1}(L${qData.level}):[未答] 逾時未作答 / 正解應為:${qData.a[correctIndex]}`;
        
        // 盲測提示
        fbBox.innerText = "⏳ 測驗逾時！已自動記錄為未作答，請前往下一題。";
        fbBox.className = "p-5 rounded-xl mb-6 font-bold text-center text-lg shadow-sm border border-slate-200 bg-slate-50 text-slate-700 block";

        state.logs.push(logText);
        
        if (state.currentDifficultyLevel > 1) {
            state.currentDifficultyLevel--;
        }

        document.getElementById("next-btn").classList.remove("hidden");
    }

    function loadNextAdaptiveQuestion() {
        state.isAnswered = false;
        document.getElementById("next-btn").classList.add("hidden");
        document.getElementById("feedback-box").classList.add("hidden");
        
        clearInterval(state.qInterval);
        
        state.currentQuestionData = getNextQuestion();
        const qData = state.currentQuestionData;
        
        document.getElementById("progress-text").innerText = `第 ${state.currentQ + 1} / ${state.maxQuestions} 題`;
        document.getElementById("progress-bar").style.width = `${((state.currentQ + 1) / state.maxQuestions) * 100}%`;
        
        document.getElementById("question-text").innerText = `${state.currentQ + 1}. ${qData.q}`;

        const opts = document.getElementById("options-container");
        opts.innerHTML = "";
        
        qData.a.forEach((text, idx) => {
            const btn = document.createElement("button");
            btn.className = "w-full text-left px-6 py-4 border-2 rounded-xl font-medium transition-all duration-200 hover:bg-blue-50/50 hover:border-blue-300 bg-white border-slate-200 shadow-sm hover:shadow option-btn text-slate-700";
            btn.innerText = text;
            btn.onclick = () => selectAnswer(idx, btn);
            opts.appendChild(btn);
        });

        startQuestionTimer();
    }

    function selectAnswer(selectedIndex, btnElement) {
        if (state.isAnswered) return;
        state.isAnswered = true;
        
        clearInterval(state.qInterval); 

        const qData = state.currentQuestionData;
        const correctIndex = qData.c;
        const allBtns = document.querySelectorAll(".option-btn");
        const fbBox = document.getElementById("feedback-box");

        // 鎖定按鈕
        allBtns.forEach(b => b.classList.add("disabled-btn"));

        let logText = "";
        if (selectedIndex === correctIndex) {
            // 盲測模式：不顯示綠色正確，只標記選擇狀態
            btnElement.classList.add("selected-ans");
            
            state.rawScore += qData.level; 
            logText = `Q${state.currentQ + 1}(L${qData.level}):[對] 技師選:${qData.a[selectedIndex]}`;
            
            if (state.currentDifficultyLevel < 5) state.currentDifficultyLevel++;
        } else {
            // 盲測模式：不顯示紅色錯誤與綠色正解，只標記選擇狀態
            btnElement.classList.add("selected-ans");
            
            logText = `Q${state.currentQ + 1}(L${qData.level}):[錯] 技師選:${qData.a[selectedIndex]} / 正解應為:${qData.a[correctIndex]}`;
            
            if (state.currentDifficultyLevel > 1) state.currentDifficultyLevel--;
        }

        // 統一盲測提示，不透漏正誤
        fbBox.innerText = "✓ 作答已記錄，請前往下一題。";
        fbBox.className = "p-5 rounded-xl mb-6 font-bold text-center text-lg shadow-sm border border-blue-200 bg-blue-50 text-blue-700 block";

        state.logs.push(logText);
        
        // 自動顯示下一題按鈕
        const nextBtn = document.getElementById("next-btn");
        nextBtn.classList.remove("hidden");
        nextBtn.innerText = (state.currentQ === state.maxQuestions - 1) ? "提交並結束測驗" : "前往下一題 ➔";
    }

    function nextQuestion() {
        state.currentQ++;
        if (state.currentQ < state.maxQuestions) {
            loadNextAdaptiveQuestion();
        } else {
            forceSubmit(false); 
        }
    }

    function forceSubmit(isAborted) {
        if (!state.inProgress) return; 
        state.inProgress = false; 
        clearInterval(state.qInterval); 

        let finalLogs = [...state.logs];

        if (isAborted) {
            finalLogs.push("【嚴重警告：技師於此題強行關閉網頁或返回上一頁，疑似作弊】");
        } 

        // ★ 動態權重換算滿分 100 分 ★
        // 頂尖考生路徑：Q1(1)+Q2(2)+Q3(3)+Q4(4) + 剩下31題全在Level 5(31*5=155) = 最高 165 分。
        let maxTheoreticalScore = 165; 
        let finalScaledScore = Math.round((state.rawScore / maxTheoreticalScore) * 100);
        if (finalScaledScore > 100) finalScaledScore = 100;
        
        finalLogs.push(`--- 【系統判定】最終技術階級：Level ${state.currentDifficultyLevel} (${rankTitles[state.currentDifficultyLevel]}) | 原始加權總分：${state.rawScore} ---`);

        // 新版 Google Form API 路徑與五個欄位對應
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSeUulnH9NeHSapDTQHxBcMZo_AOL3B3igAOseTkYqvR4BJ02Q/formResponse";
        const params = new URLSearchParams();
        params.append("entry.1741632433", state.dealer);
        params.append("entry.1735160920", state.name);
        params.append("entry.609819735", finalScaledScore.toString());
        params.append("entry.1154807191", finalLogs.join(" | "));
        
        // 第五個欄位寫入系統評定之最終等級
        params.append("entry.1486570192", "Level " + state.currentDifficultyLevel + " (" + rankTitles[state.currentDifficultyLevel] + ")");

        // 背景發送資料到 Google
        fetch(formUrl, {
            method: "POST", 
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString()
        }).catch(err => console.log("傳送失敗:", err));

        // 無論發送成功與否，立刻切換至全盲測之結果畫面
        isFormSubmitted = true;
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("res-dealer").innerText = state.dealer;
        document.getElementById("res-name").innerText = state.name;
    }
</script>
