            background-clip: text;
            -webkit-background-clip: text;

        }

        { level: 3, q: "執行 ADAS 前方攝影機 (跟車鏡頭) 的更換與動態校正時，通常有什麼嚴格的工作環境要求？", a: ["必須在下雨天積水路面進行以測試雨刷連動", "車輛必須維持原地靜止不動並架設專用標靶", "須在標線清晰且無阻擋之道路依規定車速行駛", "必須在無光的全黑環境下進行以測試夜視功能"], c: 2 },
        { level: 3, q: "Peugeot 408 若多媒體主機螢幕完全當機無反應，技師在斷電前可優先嘗試什麼快速重置操作？", a: ["直接向原廠申請保固更換全新的多媒體螢幕", "長按音量鍵或車輛圖示按鍵達十秒強制重置系統", "使用絕緣膠槌輕輕敲擊螢幕邊框震動內部接點", "強制拔除機油壓力感知器接頭以觸發電腦斷電"], c: 1 },
        { level: 3, q: "更換具備電子離合器控制的水泵浦後，必須在 DiagBox 內執行什麼電腦操作以確保功能正常？", a: ["必須重設車內收音機頻道以清除干擾雜訊", "執行元件作動測試與摩擦輪學習初始化確保接合", "必須修改引擎排氣量配置碼以匹配全新水泵流量", "必須清除所有的輪胎胎壓異常碼以解除動力限制"], c: 1 },
        { level: 3, q: "診斷難以重現的偶發故障時，此時最適合使用 DiagBox 的什麼進階功能？", a: ["讀取保養里程確認是否逾期導致系統主動降載", "開啟 Record 功能錄製行駛動態波形數據抓取異常", "連接網路直接強制更新所有 ECU 軟體至最新版本", "不需插電腦診斷直接更換煞車踏板總成與開關"], c: 1 },
        { level: 3, q: "DiagBox 的個性化參數測量功能，是否允許技師同時「跨越不同電腦模組」讀取多個感測器訊號？", a: ["可以，DiagBox 完全沒有任何讀取模組與數量限制", "可以，但系統僅限跨越引擎與變速箱這兩個動力電腦", "不可以，系統架構限制無法跨越不同電腦同時監控", "需視車輛出廠年份與網關架構而定舊車無法支援"], c: 2 },

        { level: 3, q: "匯入 JDD 試算表後，若想分析進場前幾天的故障情形，建議的第一步排版動作為何？", a: ["隱藏表格內全部的空白欄位以縮減表格顯示範圍", "針對日期欄位進行 A 到 Z 的排序還原故障發生順序", "將數據全數繪製成電壓折線圖進行圖形化比對分析", "將英文字體全數強制轉為中文以利本地工程師閱讀"], c: 1 },

        { level: 3, q: "為配合柴油車 DPF/GPF 微粒過濾器再生，最佳的引擎轉速應維持在多少以上以產生足夠的高溫排氣？", a: ["穩定維持在 1000 rpm 以上即可產生足夠再生高溫", "穩定維持在 1500 rpm 以上即可產生足夠再生高溫", "穩定維持在 2000 rpm 以上確保排溫足夠燒結碳微粒", "穩定維持在 3500 rpm 以上確保排溫足夠燒結碳微粒"], c: 2 },
        { level: 3, q: "HAS (Highway Assist System 高速公路輔助系統) 結合了 ACC (主動車距巡航) 與什麼智慧轉向邏輯？", a: ["結合了撥動方向燈後自動變換車道超車的高階邏輯", "結合了主動修正方向盤維持車道置中的橫向控制邏輯", "結合了抵達目的地後全自動偵測車位並煞停入庫邏輯", "結合了夜間紅外線行人偵測並主動閃避的轉向邏輯"], c: 1 },
        { level: 3, q: "若使用 Witech 系統診斷時僅建立單一中文報告，將案件升級至 L2 總部支援時容易發生什麼狀況？", a: ["系統會透過 AI 自動翻譯成多國語言供工程師判讀", "原廠工程師無法判讀中文增加客訴退件與溝通風險", "該檔案會被伺服器總部強制退回 L0 層級重新處理", "無任何影響因為全球總部皆配備中文人員可正常判讀"], c: 1 },
        { level: 3, q: "相較於純英文的 Witech 系統，DiagBox 軟體在產出的診斷資料與報告時，會自動建立幾種語言版本？", a: ["為節省空間僅建立 1 種安裝時選擇的預設語言", "會自動建立包含法文的 2 種對照語言避免翻譯誤差", "會自動建立包含法英的 3 種對照語言避免翻譯誤差", "會自動建立包含日德的 5 種對照語言避免翻譯誤差"], c: 2 },
        { level: 3, q: "Witech 診斷系統中，若要查看特定故障碼發生當下的物理環境數值（如車速水溫），可檢視什麼核心資料？", a: ["檢視系統儲存的凍結資料 (Freeze Frame) 與事件快照", "翻閱車主手冊內的標準保養規範尋找故障發生條件", "查詢原廠發佈的 TSB 技術通報尋找相符的故障症狀", "調閱車輛過往的服務保養紀錄比對更換零件的履歷"], c: 0 },
        { level: 3, q: "使用氣缸壓縮壓力錶檢查引擎時,若發現相鄰兩缸的壓力皆同時極低,初步可判斷為引擎發生了什麼嚴重故障？", a: ["進氣門嚴重積碳導致汽門無法完全關閉產生漏氣", "排氣門嚴重燒蝕導致汽門無法完全密合產生漏氣", "活塞環嚴重磨損導致氣體竄入曲軸箱產生嚴重漏氣", "兩缸之間的汽缸床墊片燒毀破穿導致相鄰兩缸漏氣"], c: 3 },

    let isFormSubmitted = false;

    const rankTitles = {
        1: "助理技師 (Level 1)",
        2: "初級技師 (Level 2)",
        3: "中級技師 (Level 3)",
        4: "高級技師 (Level 4)",
        5: "資深專家 (Level 5)"
    };

    document.getElementById('hidden_iframe').onload = function() {
        if(isFormSubmitted) {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("res-dealer").innerText = state.dealer;
            document.getElementById("res-name").innerText = state.name;
        }
    };

    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    window.addEventListener("beforeunload", function (e) {
        if (state.inProgress) {
            e.preventDefault();
            e.returnValue = "測驗尚未完成，確定要離開嗎？進度將遺失。";
        }
    });

    window.addEventListener("pagehide", function(e) {
        if (state.inProgress) {
            forceSubmit(true);
        }
    });

    window.addEventListener("visibilitychange", function() {
        if (document.visibilityState === 'hidden' && state.inProgress) {
            forceSubmit(true); 
        }
    });

    function startExam() {
        const d = document.getElementById("dealer-input").value.trim();
        const n = document.getElementById("name-input").value.trim();
        if (!d || !n) return alert("請完整填寫經銷商與姓名！");

        state.dealer = d; 
        state.name = n;
        state.inProgress = true; 
        
        document.getElementById("login-screen").classList.add("opacity-0", "scale-95");
        setTimeout(() => {
            document.getElementById("login-screen").classList.add("hidden");
            const quiz = document.getElementById("quiz-screen");
            quiz.classList.remove("hidden");
            void quiz.offsetWidth;
            quiz.classList.remove("opacity-0", "scale-95");

            loadNextAdaptiveQuestion();
        }, 300);
    }

    function getNextQuestion() {
        let availableQs = allQuizData.map((q, index) => ({...q, globalIndex: index}))
                                     .filter(q => q.level === state.currentDifficultyLevel && !state.usedQuestions.has(q.globalIndex));
        
        if (availableQs.length === 0) {
            availableQs = allQuizData.map((q, index) => ({...q, globalIndex: index}))
                                     .filter(q => !state.usedQuestions.has(q.globalIndex));
        }

        let q = availableQs[Math.floor(Math.random() * availableQs.length)];
        state.usedQuestions.add(q.globalIndex);

        let originalCorrectText = q.a[q.c]; 
        let shuffledOptions = shuffleArray(q.a); 
        let newCorrectIndex = shuffledOptions.indexOf(originalCorrectText); 

        return {
            q: q.q,
            a: shuffledOptions,
            c: newCorrectIndex,
            level: q.level
        };
    }

    function startQuestionTimer() {
        clearInterval(state.qInterval);
        state.qTimer = 120; 
        updateQTimerDisplay();

        state.qInterval = setInterval(() => {
            state.qTimer--;
            updateQTimerDisplay();

            if (state.qTimer <= 0) {
                clearInterval(state.qInterval);
                handleQuestionTimeUp();
            }
        }, 1000);
    }

    function updateQTimerDisplay() {
        let m = Math.floor(state.qTimer / 60).toString().padStart(2, '0');
        let s = (state.qTimer % 60).toString().padStart(2, '0');
        const qDisplay = document.getElementById("q-timer-display");
        qDisplay.innerText = `⏳ 本題: ${m}:${s}`;
        
        if(state.qTimer <= 10 && state.qTimer > 0) {
            qDisplay.parentElement.classList.add("animate-pulse", "bg-red-100", "border-red-300");
        } else {
            qDisplay.parentElement.classList.remove("animate-pulse", "bg-red-100", "border-red-300");
        }
    }

    function handleQuestionTimeUp() {
        document.getElementById("next-btn").classList.add("hidden");
        processAnswerAndGoNext(); 
    }

    function loadNextAdaptiveQuestion() {
        state.currentSelection = null; 
        document.getElementById("next-btn").classList.add("hidden");
        document.getElementById("feedback-box").classList.add("hidden");
        
        clearInterval(state.qInterval);
        
        state.currentQuestionData = getNextQuestion();
        const qData = state.currentQuestionData;
        
        document.getElementById("progress-text").innerText = `第 ${state.currentQ + 1} / ${state.maxQuestions} 題`;
        document.getElementById("progress-bar").style.width = `${((state.currentQ + 1) / state.maxQuestions) * 100}%`;
        
        document.getElementById("question-text").innerText = `${state.currentQ + 1}. ${qData.q}`;

        const opts = document.getElementById("options-container");
        opts.innerHTML = "";
        
        qData.a.forEach((text, idx) => {
            const btn = document.createElement("button");
            btn.className = "w-full text-left px-6 py-4 border-2 rounded-xl font-medium transition-all duration-200 hover:bg-blue-50/50 hover:border-blue-300 bg-white border-slate-200 shadow-sm hover:shadow option-btn text-slate-700 leading-relaxed";
            btn.innerText = text;
            btn.onclick = () => selectAnswer(idx, btn);
            opts.appendChild(btn);
        });

        startQuestionTimer();
    }

    function selectAnswer(selectedIndex, btnElement) {
        state.currentSelection = selectedIndex;
        
        const allBtns = document.querySelectorAll(".option-btn");
        allBtns.forEach(b => b.classList.remove("selected-ans"));
        btnElement.classList.add("selected-ans");

        const nextBtn = document.getElementById("next-btn");
        nextBtn.classList.remove("hidden");
        nextBtn.innerText = (state.currentQ === state.maxQuestions - 1) ? "確認提交並結束測驗" : "確認並前往下一題 ➔";
    }

    function confirmAndNext() {
        if (state.currentSelection === null) return; 
        document.getElementById("next-btn").classList.add("hidden");
        processAnswerAndGoNext();
    }

    function processAnswerAndGoNext() {
        clearInterval(state.qInterval); 

        const qData = state.currentQuestionData;
        const correctIndex = qData.c;
        let logText = "";

        if (state.currentSelection === null) {
            logText = `Q${state.currentQ + 1}(L${qData.level}):[未答] 逾時未作答 / 正解應為:${qData.a[correctIndex]}`;
            if (state.currentDifficultyLevel > 1) state.currentDifficultyLevel--;
        } else if (state.currentSelection === correctIndex) {
            state.rawScore += qData.level; 
            logText = `Q${state.currentQ + 1}(L${qData.level}):[對] 技師選:${qData.a[state.currentSelection]}`;
            if (state.currentDifficultyLevel < 5) state.currentDifficultyLevel++;
        } else {
            logText = `Q${state.currentQ + 1}(L${qData.level}):[錯] 技師選:${qData.a[state.currentSelection]} / 正解應為:${qData.a[correctIndex]}`;
            if (state.currentDifficultyLevel > 1) state.currentDifficultyLevel--;
        }

        state.logs.push(logText);

        state.currentQ++;
        if (state.currentQ < state.maxQuestions) {
            loadNextAdaptiveQuestion();
        } else {
            forceSubmit(false); 
        }
    }

    function forceSubmit(isAborted) {
        if (!state.inProgress) return; 
        state.inProgress = false; 
        clearInterval(state.qInterval); 

        let finalLogs = [...state.logs];

        if (isAborted) {
            finalLogs.push("【嚴重警告：技師於此題強行關閉網頁或返回上一頁，中途棄考】");
        } 

        // 35題的最高可能分數計算：1+2+3+4+ (31*5) = 165
        let maxTheoreticalScore = 165; 
        let finalScaledScore = Math.round((state.rawScore / maxTheoreticalScore) * 100);
        if (finalScaledScore > 100) finalScaledScore = 100;
        
        finalLogs.push(`--- 【系統判定】最終技術階級：Level ${state.currentDifficultyLevel} (${rankTitles[state.currentDifficultyLevel]}) | 原始加權總分：${state.rawScore} ---`);

        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSeUulnH9NeHSapDTQHxBcMZo_AOL3B3igAOseTkYqvR4BJ02Q/formResponse";

        if (isAborted) {
            // ★ 中途離開專用：使用 sendBeacon 確保網頁關閉時也能送出資料 ★
            const params = new URLSearchParams();
            params.append("entry.1741632433", state.dealer);        
            params.append("entry.1735160920", state.name);          
            params.append("entry.609819735", finalScaledScore.toString()); 
            params.append("entry.1154807191", finalLogs.join(" | "));      
            params.append("entry.1486570192", "Level " + state.currentDifficultyLevel + " (" + rankTitles[state.currentDifficultyLevel] + ") [棄考]");
            
            navigator.sendBeacon(formUrl, params);
        } else {
            // ★ 正常交卷：使用實體表單送出 ★
            document.getElementById("gf-dealer").value = state.dealer;
            document.getElementById("gf-name").value = state.name;
            document.getElementById("gf-score").value = finalScaledScore.toString();
            document.getElementById("gf-details").value = finalLogs.join(" | ");
            document.getElementById("gf-level").value = "Level " + state.currentDifficultyLevel + " (" + rankTitles[state.currentDifficultyLevel] + ")";

            isFormSubmitted = true;
            document.getElementById("google-form").submit();
        }
    }
</script>
</body>
</html>
